name: Repository checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source-and-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify publication tree (no hardware access)
        run: python tools/verify_repository.py
